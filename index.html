<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="仕入れ入力">
<meta name="format-detection" content="telephone=no">
<title>Grand Trading 仕入れ入力</title>
<link rel="stylesheet" href="styles.css?v=20260924-1">
</head>
<body>
<noscript><p style="padding:24px;font-size:18px">このアプリは JavaScript を使います。ブラウザの設定で JavaScript をオンにしてください。</p></noscript>

<!-- 初期設定（拠点・PIN・言語） -->
<section id="setup" class="setup hidden">
  <div class="setup-card">
    <div class="brand-mark">GT</div>
    <p class="eyebrow">GRAND TRADING</p>
    <h1 data-i18n="appTitle">仕入れ入力</h1>
    <p class="muted" data-i18n="setupLead">どこの拠点ですか？（初回だけ）</p>
    <div class="lang-row">
      <button type="button" class="lang" data-lang="ja">日本語</button>
      <button type="button" class="lang" data-lang="en">English</button>
    </div>
    <label data-i18n="site">拠点</label>
    <div id="siteButtons" class="site-buttons"></div>
    <label data-i18n="userName">あなたの名前（入れなくてもOK）</label>
    <input id="userInput" maxlength="20" autocomplete="off" data-i18n-placeholder="userPlaceholder" placeholder="例: 山田">
    <button id="startBtn" class="primary" type="button" data-i18n="start">はじめる</button>
    <div id="setupError" class="error"></div>
  </div>
</section>

<!-- メイン -->
<div id="app" class="app hidden">
  <header class="top">
    <div class="top-left">
      <span class="brand-chip">GT</span>
      <div>
        <b data-i18n="appTitle">仕入れ入力</b>
        <small><span id="siteLabel"></span> · <span id="userLabel"></span></small>
      </div>
    </div>
    <div class="top-right">
      <span id="netDot" class="dot" title=""></span>
      <button id="langBtn" class="icon" type="button" title="Language">EN</button>
      <button id="settingsBtn" class="icon" type="button" title="設定">⚙</button>
    </div>
  </header>

  <main>
    <div id="pendingBar" class="pending hidden"><span id="pendingText"></span><button id="retryBtn" type="button" data-i18n="retry">再送</button></div>
    <div id="apiWarn" class="warn hidden" data-i18n="apiNotSet">API URL が未設定です（config.js）。登録は端末内に保存され、設定後に送信されます。</div>

    <section class="card">
      <div class="card-head"><span class="step">0</span><b data-i18n="date">日付</b></div>
      <div class="date-row">
        <input id="dateInput" type="date">
        <button id="todayBtn" class="ghost" type="button" data-i18n="today">今日</button>
      </div>
    </section>

    <section class="card" id="supCard">
      <div class="card-head"><span class="step">1</span><b data-i18n="supplier">取引先</b><button id="supChange" class="link hidden" type="button" data-i18n="change">変更</button></div>
      <div id="supSelected" class="selected hidden"></div>
      <div id="supPicker" class="picker">
        <input id="supSearch" class="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="コードまたは名前で検索">
        <div id="supFrequent" class="chips"></div>
        <div id="supList" class="list"></div>
        <button id="supAdd" class="add-row hidden" type="button"></button>
      </div>
    </section>

    <section class="card" id="itemCard">
      <div class="card-head"><span class="step">2</span><b data-i18n="item">商品</b><button id="itemChange" class="link hidden" type="button" data-i18n="change">変更</button></div>
      <div id="itemSelected" class="selected hidden"></div>
      <div id="itemPicker" class="picker">
        <input id="itemSearch" class="search" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="コードまたは名前で検索">
        <div id="itemFrequent" class="chips"></div>
        <div id="itemList" class="list"></div>
        <button id="itemAdd" class="add-row hidden" type="button"></button>
        <div id="itemAddForm" class="add-form hidden">
          <b data-i18n="newItemTitle">新しい商品を追加</b>
          <label for="newItemName" data-i18n="itemNameLabel">商品名</label>
          <input id="newItemName" maxlength="60" autocomplete="off">
          <div class="add-grid">
            <div><label for="newItemUnit" data-i18n="unitWord">単位</label><select id="newItemUnit"></select></div>
            <div><label for="newItemPrice" data-i18n="priceYen">単価（円）</label><input id="newItemPrice" inputmode="decimal" autocomplete="off" placeholder="50"></div>
          </div>
          <small data-i18n="priceHint">単価がわからなければ空欄でOK。入れた単価は経理が月末に確認します</small>
          <div class="add-actions"><button id="newItemCancel" class="ghost" type="button" data-i18n="cancelAdd">やめる</button><button id="newItemSubmit" class="primary" type="button" data-i18n="addItemSubmit">追加する</button></div>
          <div id="newItemError" class="error"></div>
        </div>
      </div>
    </section>

    <section class="card" id="qtyCard">
      <div class="card-head"><span class="step">3</span><b data-i18n="qty">数量</b></div>
      <div class="qty-row">
        <input id="qtyInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
        <span id="unitLabel" class="unit">kg</span>
      </div>
      <input id="noteInput" class="note" maxlength="60" autocomplete="off" data-i18n-placeholder="notePlaceholder" placeholder="メモ（任意）">
      <div id="priceLine" class="price-line hidden"><span data-i18n="unitPrice">単価</span> <b id="priceValue"></b><span id="priceKind" class="pill hidden"></span><span class="sep"></span><span data-i18n="amount">金額</span> <b id="amountValue">—</b></div>
      <div id="unpricedHint" class="hint hidden" data-i18n="unpricedHint">この商品は単価が都度決めです。数量だけ登録し、金額は経理がシートで入れます。</div>
      <button id="saveBtn" class="primary big" type="button" disabled data-i18n="save">登録する</button>
      <div id="saveError" class="error"></div>
    </section>

    <section class="card">
      <div class="card-head"><b data-i18n="todayEntries">最近の登録（3日分）</b><span id="todayCount" class="count">0</span><button id="refreshBtn" class="link" type="button" data-i18n="refresh">更新</button></div>
      <div id="todayList" class="today"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- 設定ドロワー -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-mask" data-close></div>
    <section>
      <button class="drawer-close" type="button" data-close>×</button>
      <h3 data-i18n="settings">設定</h3>
      <dl class="kv">
        <dt data-i18n="site">拠点</dt><dd id="dSite"></dd>
        <dt data-i18n="userName">入力者</dt><dd><input id="dUser" maxlength="20"></dd>
        <dt data-i18n="language">言語</dt><dd><button type="button" class="lang" data-lang="ja">日本語</button> <button type="button" class="lang" data-lang="en">English</button></dd>
        <dt data-i18n="masters">マスター</dt><dd><span id="dMasters"></span> <button id="dReload" class="ghost" type="button" data-i18n="reload">再取得</button></dd>
        <dt data-i18n="pendingLabel">送信待ち</dt><dd id="dPending">0</dd>
        <dt>API</dt><dd id="dApi"></dd>
        <dt data-i18n="version">版</dt><dd id="dVersion"></dd>
      </dl>
      <button id="dResetSite" class="ghost" type="button" data-i18n="changeSite">拠点を選び直す</button>
    </section>
  </div>
</div>

<!-- 確認（window.confirm の代わり） -->
<div id="confirmBox" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <p id="confirmText"></p>
    <div class="modal-actions"><button id="confirmNo" class="ghost" type="button">キャンセル</button><button id="confirmYes" class="primary" type="button">OK</button></div>
  </div>
</div>

<script src="config.js?v=20260924-1"></script>
<script src="app.js?v=20260924-1"></script>
</body>
</html>
